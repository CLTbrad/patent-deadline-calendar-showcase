name: Sync USPTO Data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: write
concurrency:
  group: uspto-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Fetch public USPTO records
        run: npm run sync
        env:
          USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
      - run: node scripts/validate-data.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- public/data/deadlines.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/deadlines.json
          git commit -m "data: refresh public USPTO deadline snapshot"
          git push
